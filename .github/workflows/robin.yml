name: Robin

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  review:
    uses: antongulin/robin/.github/workflows/review.yml@fc0bf915b634bf2f8b88ff1392acefdfb54e28d9 # v2.12.0
    with:
      review-on-synchronize: true
      runner: '"blacksmith-2vcpu-ubuntu-2604"'
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}

  approve:
    needs: review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.ROBIN_CLIENT_ID }}
          private-key: ${{ secrets.ROBIN_PRIVATE_KEY }}
          permission-pull-requests: write
      - name: Approve after review
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
